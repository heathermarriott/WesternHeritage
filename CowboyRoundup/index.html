<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cowboy Roundup - Western Heritage</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="stage">
        <div class="scene">
            <div class="sky"></div>
            <div class="hills"></div>
            <div class="ground"></div>

            <main class="game-wrap">
                <header class="title">
                    <h1 id="gameHeading" data-lang-key="game.cowboyRoundupTitle">Cowboy Roundup</h1>
                    <p class="subtitle" data-lang-key="game.cowboyRoundupSubtitle">Click the horses as they appear to round them up before time runs out!</p>
                </header>

                <div id="gameContainer">
                    <div id="gameHud">
                        <div id="gameStats">
                            <!-- Content is now generated by script -->
                        </div>
                    </div>
                    <div id="gameArea">
                        <img src="../assets/horse.png" id="horse">
                        <div id="speedSelect"></div>
                        <div id="gameOver"></div>
                    </div>
                    <a href="#" id="backToGames" class="game-link"><button class="avatarBtn" data-lang-key="game.backToGames">Back to Games Menu</button></a>
                </div>
            </main>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        // Go back to the previous page (games.html) without adding to history
        document.getElementById('backToGames').addEventListener('click', function(e) {
            e.preventDefault();
            window.history.back();
        });

        // --- Stage Scaling Logic ---
        // Reads the device dimensions from the CSS custom properties in
        // ../css/style.css instead of hardcoding them here - that file is
        // the single source of truth, so this can never drift out of sync
        // with it again the way it previously did.
        function fitStage() {
            const stage = document.getElementById('stage');
            const rootStyles = getComputedStyle(document.documentElement);
            const stageW = parseFloat(rootStyles.getPropertyValue('--device-width'));
            const stageH = parseFloat(rootStyles.getPropertyValue('--device-height'));
            const scale = Math.min(window.innerWidth / stageW, window.innerHeight / stageH);
            const offsetX = (window.innerWidth - stageW * scale) / 2;
            const offsetY = (window.innerHeight - stageH * scale) / 2;
            stage.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
        }
        window.addEventListener('resize', fitStage);
        fitStage();
    </script>
</body>
</html>
